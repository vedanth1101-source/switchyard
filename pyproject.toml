[project]
name = "switchyard"
version = "0.0.0"
description = "LLM request router: Jev classification, deterministic routing policy, safe fallbacks."
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies mirror requirements.txt exactly: Vercel accepts either file and does not
# document precedence. tests/test_vercel_config.py fails if the two lists drift apart.
dependencies = [
    "httpx==0.28.1",
    "certifi==2026.5.20",
    "fastapi==0.143.0",
    "starlette==1.7.0",
    "pydantic==2.14.0",
    "sqlmodel==0.0.48",
    "sqlalchemy==2.1.4",
    "psycopg[binary]==3.3.6",
    "redis==8.1.0",
    "pydantic-settings==2.15.0",
]

# Local installs use requirements.txt / requirements-dev.txt (exact pins).
# The project is not built or installed as a package; pytest imports it via `pythonpath`.

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -m 'not integration and not live'"
markers = [
    "integration: needs local Postgres/Redis (docker compose up -d)",
    "live: calls real external APIs (Jev, model providers); spends credits",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
