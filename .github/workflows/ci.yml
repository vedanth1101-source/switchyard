name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Unit tests, coverage of app >= 80%
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Unit tests, coverage of app/core >= 80%
        run: pytest --cov=app.core --cov-report=term-missing --cov-fail-under=80

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: switchyard
          POSTGRES_PASSWORD: switchyard-ci-only
          POSTGRES_DB: switchyard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U switchyard -d switchyard"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web/dist (served by app.frontend)
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Integration tests against real Postgres and Redis
        env:
          DATABASE_URL: postgresql+psycopg://switchyard:switchyard-ci-only@localhost:5432/switchyard
          REDIS_URL: redis://localhost:6379/0
          FASTAPI_ENV: production
        run: >-
          pytest -m integration -rA --junitxml="$RUNNER_TEMP/integration.xml"
          tests/test_health_integration.py tests/test_migrations_integration.py tests/test_budget_integration.py
      - name: Require the integration tests to have run and passed (not skipped)
        run: |
          python - <<'EOF'
          import os, sys, xml.etree.ElementTree as ET
          REQUIRED = {
              "test_health_reports_db_and_redis",
              "test_migrations_upgrade_downgrade_round_trip",
              "test_cap_allows_exactly_three_of_five_and_counts_denied_reservations",
              "test_concurrent_reservations_across_independent_clients_never_exceed_the_cap",
              "test_concurrent_reservations_at_cap_minus_one_allow_exactly_one",
              "test_reservation_sets_the_two_day_ttl",
              "test_reservation_adds_a_ttl_to_an_existing_key_without_one",
              "test_expired_counter_resets_the_budget",
              "test_utc_midnight_starts_a_new_key_and_leaves_the_previous_day_unchanged",
              "test_closed_local_port_fails_closed_without_logging_the_url",
              "test_corrupt_counter_fails_closed_in_available_and_reserve",
          }
          root = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "integration.xml")).getroot()
          cases = list(root.iter("testcase"))
          bad = [c.get("name") for c in cases if c.find("skipped") is not None
                 or c.find("failure") is not None or c.find("error") is not None]
          passed = {c.get("name") for c in cases} - set(bad)
          if not cases or bad or not REQUIRED <= passed:
              sys.exit(f"integration check failed: ran={len(cases)} not_passed={bad} passed={sorted(passed)}")
          print(f"integration check ok: {sorted(passed)}")
          EOF

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
